name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: chronos
          POSTGRES_PASSWORD: chronos
          POSTGRES_DB: chronos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chronos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://chronos:chronos@localhost:5432/chronos
      AUTH0_DOMAIN: placeholder.us.auth0.com
      AUTH0_AUDIENCE: https://chronos.api
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: pip install -r backend/requirements.txt

      # Applying every migration against a fresh DB is the real check that
      # they're consistent with shared/models.py -- not just that they exist.
      - name: Apply migrations
        run: alembic upgrade head

      - name: Import the app (catches missing deps / broken imports)
        working-directory: backend
        run: python -c "from app.main import app"

      - name: Run tests
        working-directory: backend
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  scraper:
    runs-on: ubuntu-latest
    env:
      SIA_CATALOGO_URL: https://sia.unal.edu.co/Catalogo/facespublico/public/servicioPublico.jsf?taskflowId=task-flow-AC_CatalogoAsignaturas
      DATABASE_URL: postgresql+psycopg://chronos:chronos@localhost:5432/chronos
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      # Playwright's browser binaries aren't needed just to import the
      # modules, and downloading them would slow this job down a lot.
      - run: pip install -r scraper/requirements.txt

      - name: Import scraper modules
        working-directory: scraper
        run: python -c "import config, sia_client, parser, persist, db, scrape, crawl"
